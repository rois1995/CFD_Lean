name: Lean verification

on:
  workflow_call:
    inputs:
      release:
        description: Run the full paranoid release verification.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Lean verification
    runs-on: ubuntu-latest
    steps:
      - name: Check release PR source
        if: inputs.release
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || ( "$HEAD_BRANCH" != develop && "$HEAD_BRANCH" != hotfix/* ) ]]; then
            echo 'Release PRs must come from develop or a hotfix branch in this repository.'
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check navigation-only changes
        id: docs
        if: ${{ !inputs.release }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m unittest discover -s .github/scripts
          docs_only=$(python3 .github/scripts/check_docs.py "$BASE_SHA" "$HEAD_SHA")
          echo "Documentation fast path: $docs_only" >&2
          echo "only=$docs_only" >> "$GITHUB_OUTPUT"
      # The runner has 2 cores, 7.6 GB of memory and no swap (measured in the build log). A Lean process with Mathlib
      # loaded needs about 7 GB, the heavy JST1 kernel checks 9-12 GB, and the paper-1 comparator with the five
      # external checkers about 13 GB in one checker (con-ron, measured locally). Without swap, two large Lean
      # processes thrash the page cache and a module can take ten times longer. Swap keeps both builds and checks
      # complete and much faster.
      - name: Add swap space
        if: steps.docs.outputs.only != 'true'
        run: |
          free -h
          df -h / /mnt || true
          # preinstalled toolkits that this job does not use
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h / /mnt || true
      - name: Install pinned Lean and Mathlib cache
        if: steps.docs.outputs.only != 'true'
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      # Integration only: reuse the compiled modules of this package from the last build of the PR or of develop.
      # Lake validates its saved build traces and rebuilds artifacts whose recorded inputs no longer match; source and
      # import changes therefore invalidate affected modules transitively. Release verification never restores this
      # cache and builds everything from scratch.
      - name: Restore the package build cache (integration only)
        id: package-cache
        if: ${{ !inputs.release && steps.docs.outputs.only != 'true' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: cfdlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: cfdlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Build Burgers modules
        if: steps.docs.outputs.only != 'true'
        run: ~/.elan/bin/lake build --wfail CFDLean.Schemes.Burgers.Controls CFDLean.Schemes.Burgers.StabilityControls CFDLean.Schemes.Burgers.SSPControls CFDLean.Schemes.Burgers.MusclControls CFDLean.Schemes.Burgers.LimiterControls CFDLean.Entropy.Scalar.Controls
      - name: Check implementation against trusted Burgers statements
        if: steps.docs.outputs.only != 'true'
        run: ~/.elan/bin/lake build --wfail CFDLean.Verification.BurgersB0Verify CFDLean.Verification.BurgersB1Verify CFDLean.Verification.BurgersB2Verify CFDLean.Verification.BurgersB3Verify CFDLean.Verification.BurgersB3bVerify CFDLean.Verification.BurgersB4Verify CFDLean.Verification.BurgersE0Verify CFDLean.Verification.BurgersE0bVerify CFDLean.Verification.BurgersE0cVerify
      # The machine size and the memory pressure during the build are logged, to explain slow builds (lines [mem …]).
      - name: Build full package and integrity target
        if: steps.docs.outputs.only != 'true'
        run: |
          echo "cores: $(nproc)"; free -h; swapon --show || true
          (
            while sleep 20; do
              echo "[mem $(date -u +%T)] $(free -m | awk '/^Mem:/ {printf "used %s MB of %s MB, available %s MB", $3, $2, $7}
                /^Swap:/ {printf ", swap used %s MB", $3}') | pressure $(head -n 1 /proc/pressure/memory 2>/dev/null)"
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          ~/.elan/bin/lake build
      - name: Save the package build cache (integration only)
        if: ${{ !inputs.release && steps.docs.outputs.only != 'true' && steps.package-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: cfdlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Build and run the native Burgers executable (Float kernel, not verified arithmetic)
        if: steps.docs.outputs.only != 'true'
        run: |
          ~/.elan/bin/lake build burgers1d
          ./.lake/build/bin/burgers1d 200 200 0.4
          ./.lake/build/bin/burgers1d 200 200 0.12 --muscl
          ./.lake/build/bin/burgers1d 200 200 0.12 --limiter vanleer
          ./.lake/build/bin/burgers1d 200 200 0.15 --limiter minmod
      - name: Audit axioms and unsafe dependency closure
        if: steps.docs.outputs.only != 'true'
        run: ~/.elan/bin/lake env lean -DwarningAsError=true KernelAudit.lean
      - name: Verifier fixtures
        id: fixtures
        if: steps.docs.outputs.only != 'true'
        run: PATH="$HOME/.elan/bin:$PATH" python3 -m unittest discover -s scripts -p test_verify.py
      - name: Verify frozen contracts, result maps, catalog and trusted Burgers files
        id: verify
        # also after a fixture failure: the fixtures read the committed evidence, which is stale in a PR with new results
        if: ${{ !cancelled() && steps.docs.outputs.only != 'true' && (success() || steps.fixtures.outcome == 'failure') }}
        run: PATH="$HOME/.elan/bin:$PATH" python3 scripts/verify.py
      - name: Committed evidence equals regenerated evidence
        id: evidence
        if: steps.docs.outputs.only != 'true'
        run: >
          git diff --exit-code -- evidence/verification.json evidence/kernel-inventory.log
          evidence/inherited-types.json evidence/bindings-diff.patch evidence/binding-type-diff.json
          evidence/SHA256SUMS
      # Integration only: when the verifier or the evidence comparison fails, regenerate a complete, coherent evidence
      # set and hand it back as a download, so that a PR can take it from CI instead of a local full run
      # (CONTRIBUTING.md, "CI first"). After a verifier failure, the raw types are recorded first and the new pin is
      # set in this job's copy of scripts/verify.py only; the full verifier must then pass, or nothing is uploaded.
      - name: Regenerate the evidence for the PR (after a verifier or evidence failure)
        id: regen
        if: >-
          ${{ failure() && !inputs.release && steps.docs.outputs.only != 'true' &&
              (steps.fixtures.outcome == 'failure' || steps.verify.outcome == 'failure' ||
               steps.evidence.outcome == 'failure') }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ "${{ steps.verify.outcome }}" = failure ]; then
            python3 scripts/verify.py --record-raw-types
            pin=$(sha256sum evidence/raw-types.json | cut -d' ' -f1)
            sed -i "s/^RAW_TYPES_SHA256 = \".*\"/RAW_TYPES_SHA256 = \"$pin\"/" scripts/verify.py
            echo "$pin" > evidence/RAW_TYPES_SHA256.txt
          fi
          python3 scripts/verify.py
      - name: Upload the regenerated evidence
        if: ${{ failure() && steps.regen.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: regenerated-evidence
          path: |
            evidence/verification.json
            evidence/kernel-inventory.log
            evidence/inherited-types.json
            evidence/bindings-diff.patch
            evidence/binding-type-diff.json
            evidence/SHA256SUMS
            evidence/build.log
            evidence/raw-types.json
            evidence/RAW_TYPES_SHA256.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Install bubblewrap sandbox
        if: inputs.release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Judge each bridge against its trusted challenge (kernel and five external checkers)
        if: inputs.release
        run: |
          for config in Challenges/*.comparator.json; do
            echo "== $config"
            ~/.elan/bin/lake comparator --paranoid --config "$config"
          done
