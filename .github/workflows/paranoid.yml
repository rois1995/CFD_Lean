name: Paranoid comparator on demand

# Optional check for PRs into develop. It runs the same paranoid comparator step as release verification, but only
# when requested: add the `paranoid` label to the PR, or start it from the Actions tab for a branch. It is not a
# required check. The release PR into main runs it again, always with every challenge.
#
# On a PR the paper-1 challenge (JST1) is skipped unless the PR changes paper-1 files: its build and its external
# kernel checks take hours, and the paper is closed. Only the modules the selected challenges need are built.

on:
  pull_request:
    branches: [develop]
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      configs:
        description: Comparator configs to check (shell glob).
        required: false
        default: Challenges/*.comparator.json
        type: string

concurrency:
  group: paranoid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comparator:
    name: Paranoid comparator
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'paranoid')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select comparator configs
        env:
          CONFIGS: ${{ inputs.configs || 'Challenges/*.comparator.json' }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          shopt -s nullglob
          configs=( $CONFIGS )
          if [ ${#configs[@]} -eq 0 ]; then echo "No config matches: $CONFIGS"; exit 1; fi
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "origin/$BASE...HEAD")
            if ! grep -qE '^(CFDLean/Papers/JST1/|CFDLean/Verification/JST1|Challenges/JST1|specifications/JST1/)' <<< "$changed"; then
              kept=()
              for c in "${configs[@]}"; do [ "$c" = Challenges/JST1.comparator.json ] || kept+=("$c"); done
              configs=( "${kept[@]}" )
              echo "No paper-1 change: JST1 skipped."
            fi
          fi
          printf '%s\n' "${configs[@]}" > "$RUNNER_TEMP/configs.txt"
          cat "$RUNNER_TEMP/configs.txt"
      # Same memory note as in lean-verification.yml: the runner has 7.6 GB and no swap, the heavy JST1 kernel checks
      # need 9-12 GB and the paper-1 comparator about 13 GB. Add swap before the build, or the runner can be lost.
      - name: Add swap space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Install pinned Lean and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build the modules the selected challenges need
        run: |
          mods=$(python3 -c 'import json,sys; print(" ".join(m for p in sys.argv[1:] for m in (json.load(open(p))["solution_module"], json.load(open(p))["challenge_module"])))' $(cat "$RUNNER_TEMP/configs.txt"))
          echo "$mods"
          ~/.elan/bin/lake build $mods
      - name: Install bubblewrap sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Judge each bridge against its trusted challenge (kernel and five external checkers)
        run: |
          for config in $(cat "$RUNNER_TEMP/configs.txt"); do
            echo "== $config"
            ~/.elan/bin/lake comparator --paranoid --config "$config"
          done
