name: Develop build cache

# After each merge into develop, build the package once and save its compiled modules, so that new pull requests
# into develop start from a warm cache (GitHub lets a pull request restore caches of its base branch only).
# This job only builds; the checks run in Integration CI and Release verification.

on:
  push:
    branches: [develop]

concurrency:
  group: develop-build-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: Build and save the package cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Restore the package build cache
        id: package-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: cfdlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: cfdlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      - name: Build full package
        run: ~/.elan/bin/lake build
      - name: Save the package build cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .lake/build
          key: cfdlean-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
