name: Publish official release documentation

on:
  release:
    types: [published]

concurrency:
  group: stable-documentation-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the official release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ref="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$ref")" = tag
          test "$(git rev-parse "$ref^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-list --first-parent --merges origin/main | grep -Fx "$GITHUB_SHA"
      - name: Check generated documentation
        run: |
          python3 scripts/generate_capabilities.py --check
          python3 scripts/generate_import_graph.py --check
      - name: Build the tagged documentation
        env:
          CFDLEAN_DOCS_RELEASE: ${{ github.event.release.tag_name }}
          CFDLEAN_DOCS_REVISION: ${{ github.sha }}
        run: |
          python3 -m pip install -r requirements-docs.txt
          python3 -m mkdocs build --strict
      - name: Configure Pages
        if: ${{ toJSON(github.event.repository.private) == 'false' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the static site
        if: ${{ toJSON(github.event.repository.private) == 'false' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy stable release
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
