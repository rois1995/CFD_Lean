name = "cfdlean"
version = "0.1.0"
defaultTargets = ["CFDLean", "Integrity"]
allowNonModules = true

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "CFDLean"

[[lean_lib]]
name = "Integrity"

# Challenge modules for `lake comparator`. They state trusted theorems with `sorry` holes, so they are not a default
# target and no library module imports them.
[[lean_lib]]
name = "Challenges"

# Burgers E0: native executable of the array kernel with the Float instance. `Main.lean` imports only the kernel.
[[lean_exe]]
name = "burgers1d"
root = "Main"
