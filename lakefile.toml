name = "cfdlean"
version = "0.1.0"
defaultTargets = ["CFDLean", "Integrity"]
allowNonModules = true

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "CFDLean"

[[lean_lib]]
name = "Integrity"
