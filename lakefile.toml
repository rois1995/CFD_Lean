name = "cfdlean"
version = "0.1.0"
defaultTargets = ["CFDLean", "Integrity"]
allowNonModules = true

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

# The default build covers the umbrella `CFDLean` and the trusted-statement bridges `CFDLean.Verification.*` (Burgers
# B0/B1 and JST1), which no library module imports but KernelAudit.lean does.
[[lean_lib]]
name = "CFDLean"
globs = ["CFDLean", "CFDLean.Verification.+"]

[[lean_lib]]
name = "Integrity"

# Challenge modules for `lake comparator`. They state trusted theorems with `sorry` holes, so they are not a default
# target and no library module imports them.
[[lean_lib]]
name = "Challenges"
